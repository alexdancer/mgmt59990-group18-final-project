[project]
name = "amazon-reviews-aws-pipeline"
version = "0.1.0"
description = "Group 18 AWS analytics pipeline for Amazon Electronics review risk"
requires-python = ">=3.11,<3.14"
dependencies = [
  "duckdb>=1.2,<2",
  "joblib>=1.4,<2",
  "matplotlib>=3.9,<4",
  "pandas>=2.2,<3",
  "pyarrow>=18,<23",
  "scikit-learn>=1.6,<2",
]

[project.scripts]
reviews-download = "amazon_reviews_pipeline.download:main"
reviews-random-sample = "amazon_reviews_pipeline.random_sample:main"
reviews-metadata-subset = "amazon_reviews_pipeline.metadata_subset:main"
reviews-transform = "amazon_reviews_pipeline.pipeline:main"
reviews-model = "amazon_reviews_pipeline.model:main"
reviews-evidence = "amazon_reviews_pipeline.evidence:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amazon_reviews_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
